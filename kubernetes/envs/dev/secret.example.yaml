# Example only — never apply this file as-is, and never commit real values.
# `make dev-deploy` builds the real Secret from your local .env (copied from
# .env.example) and applies it to the aegis-dev namespace automatically.
# This file exists purely to document the shape services expect.
apiVersion: v1
kind: Secret
metadata:
  name: aegis-env
  namespace: aegis-dev
type: Opaque
stringData:
  POSTGRES_DB: aegis_db
  POSTGRES_USER: aegis_admin
  POSTGRES_PASSWORD: change-me-now
  AEGIS_SEED_USER_EMAIL: dev@aegis-ai.local
  AEGIS_SEED_USER_PASSWORD: change-me-now
  TEMPORAL_NAMESPACE: aegis
  JWT_SECRET: change-me-now
  ALLOWED_ORIGINS: "http://app.aegis-dev.127.0.0.1.nip.io"
  REDIS_PASSWORD: change-me-now
  MINIO_ROOT_USER: aegis_minio_admin
  MINIO_ROOT_PASSWORD: change-me-now
  CLICKHOUSE_PASSWORD: change-me-now
  NEO4J_PASSWORD: change-me-now
