# kind cluster config for the local Aegis dev environment.
# Pinned node image — never "latest" — so `make dev-create` is reproducible.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aegis-dev
nodes:
  - role: control-plane
    image: kindest/node:v1.30.4
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
