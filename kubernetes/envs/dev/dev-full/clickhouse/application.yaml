apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-clickhouse-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: clickhouse
      targetRevision: 9.4.4
      helm:
        valueFiles:
          - $values/kubernetes/envs/dev/dev-full/clickhouse/values.yaml
    - repoURL: https://github.com/Aegis-AI-Organizations/Aegis-AI-Infra.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: aegis-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
