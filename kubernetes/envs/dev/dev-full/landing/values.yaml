nameOverride: "landing-dev"

replicaCount: 1

image:
  repository: ghcr.io/aegis-ai-organizations/aegis-ai-landing
  tag: "dev-local"
  pullPolicy: Never

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

env:
  - name: PORT
    value: "3000"

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 25m
    memory: 64Mi

networkPolicy:
  enabled: false
