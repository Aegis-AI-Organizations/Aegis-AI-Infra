# GPU note: no nvidia.com/gpu resource is requested anywhere in this chart.
# PLANNER/GUIDER/EXECUTOR point at an Ollama instance on the developer's host
# (CPU is fine, just slower). replicaCount stays 0 + KEDA scale-from-zero, so
# this worker is never actually scheduled unless a scan is triggered — the
# "explicitly disabled by default" mode the brief asks for. No local Ollama?
# Leave it at 0 and skip pentest/crewai-dependent flows.
nameOverride: "crewai-worker-dev"

replicaCount: 0
terminationGracePeriodSeconds: 60

image:
  repository: ghcr.io/aegis-ai-organizations/aegis-ai-agent-crew
  tag: "dev-local"
  pullPolicy: Never

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

probes:
  enabled: false

env:
  - name: CREWAI_MODE
    value: "worker"
  - name: TEMPORAL_HOST
    value: "aegis-temporal-dev-frontend.aegis-dev.svc.cluster.local:7233"
  - name: TEMPORAL_NAMESPACE
    valueFrom:
      secretKeyRef:
        name: aegis-env
        key: TEMPORAL_NAMESPACE
  - name: CREWAI_TASK_QUEUE
    value: "CREWAI_TASK_QUEUE"
  - name: TEMPORAL_TLS_ENABLE
    value: "false"
  - name: PLANNER_PROVIDER
    value: "ollama"
  - name: PLANNER_MODEL
    value: "llama3.1:8b"
  - name: PLANNER_API_BASE
    value: "http://host.docker.internal:11434"
  - name: GUIDER_PROVIDER
    value: "ollama"
  - name: GUIDER_MODEL
    value: "WhiteRabbitNeo/Llama-3.1-WhiteRabbitNeo-2-8B:latest"
  - name: GUIDER_API_BASE
    value: "http://host.docker.internal:11434"
  - name: EXECUTOR_PROVIDER
    value: "ollama"
  - name: EXECUTOR_MODEL
    value: "deepseek-coder-v2:16b"
  - name: EXECUTOR_API_BASE
    value: "http://host.docker.internal:11434"

resources:
  limits:
    cpu: 500m
    memory: 768Mi
  requests:
    cpu: 100m
    memory: 256Mi

networkPolicy:
  enabled: false

keda:
  enabled: true
  minReplicaCount: 0
  maxReplicaCount: 2
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: temporal
      metadata:
        namespace: "aegis"
        taskQueue: "CREWAI_TASK_QUEUE"
        useTLS: "false"
        queueTypes: "workflow,activity"
        targetQueueSize: "1"
        activationTargetQueueSize: "0"
        endpoint: "aegis-temporal-dev-frontend.aegis-dev.svc.cluster.local:7233"
