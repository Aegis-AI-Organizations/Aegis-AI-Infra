nameOverride: "dashboard-dev"

replicaCount: 1

image:
  repository: ghcr.io/aegis-ai-organizations/aegis-ai-dashboard
  tag: "dev-local"
  pullPolicy: Never

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: app.aegis-dev.127.0.0.1.nip.io
      paths:
        - path: /
          pathType: ImplementationSpecific

env:
  - name: API_GATEWAY_URL
    value: "/api"

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 25m
    memory: 64Mi

initContainers:
  - name: config-init
    image: busybox:1.36.1
    command: ["sh", "-c", "cp /tmp/nginx/default.conf /etc/nginx/conf.d/default.conf"]
    volumeMounts:
      - name: nginx-cm-volume
        mountPath: /tmp/nginx
      - name: nginx-conf-dir
        mountPath: /etc/nginx/conf.d

volumeMounts:
  - name: nginx-conf-dir
    mountPath: /etc/nginx/conf.d

volumes:
  - name: nginx-cm-volume
    configMap:
      name: dashboard-nginx-config
  - name: nginx-conf-dir
    emptyDir: {}

networkPolicy:
  enabled: false
