apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-nvidia-device-plugin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://nvidia.github.io/k8s-device-plugin
    targetRevision: "0.17.1"
    chart: nvidia-device-plugin
    helm:
      values: |
        runtimeClassName: nvidia
        affinity: {}
        nodeSelector:
          accelerator: nvidia-rtx4070
        tolerations:
          - key: aegis.ai/gpu
            operator: Equal
            value: "true"
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-device-plugin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
