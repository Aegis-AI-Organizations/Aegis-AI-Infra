nameOverride: "landing-mvp"

replicaCount: 1

image:
  repository: ghcr.io/aegis-ai-organizations/aegis-ai-landing
  tag: "v2.0.44"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

env:
  - name: PORT
    value: "3000"

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

networkPolicy:
  enabled: true
  allowDNS: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: aegis-edge-proxy
      ports:
        - port: 3000
          protocol: TCP
